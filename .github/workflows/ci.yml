name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - name: npm audit (advisory, non-blocking)
        run: npm audit || true
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Start Postgres + Piper
        run: docker compose -f docker-compose.dev.yml up -d --build
      - name: Run e2e
        run: npm run test:e2e
        env:
          DATABASE_URL: postgres://kak:kak@localhost:5432/kak
          JWT_SECRET: ci-e2e-secret-at-least-32-characters-long
          AUTH_RATE_LIMIT_MAX: "1000"
          PIPER_URL: http://localhost:5001
          TTS_CACHE_DIR: /tmp/kak-tts-cache
          ADMIN_EMAIL: admin@example.com
          ADMIN_PASSWORD: change-me-123
      - name: Teardown
        if: always()
        run: docker compose -f docker-compose.dev.yml down -v

  deploy:
    runs-on: ubuntu-latest
    needs: [verify, e2e]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push app
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/kak-app:main
            ghcr.io/${{ github.repository }}/kak-app:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build and push piper
        uses: docker/build-push-action@v6
        with:
          context: ./piper
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/kak-piper:main
            ghcr.io/${{ github.repository }}/kak-piper:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Trigger Portainer redeploy
        run: |
          url="${{ secrets.PORTAINER_WEBHOOK_URL }}"
          if [ -z "$url" ]; then echo "::warning::PORTAINER_WEBHOOK_URL not set; images pushed but stack not redeployed."; exit 0; fi
          curl -fsS -X POST "$url"
